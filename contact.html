<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>צור קשר | go IL אפילייט</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #f3f4f6;
  color: #111827;
}

/* סרגל עליון */
.topbar {
  height: 64px;
  background: linear-gradient(90deg, #111827, #1f2937, #0f172a);
  color: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  position: sticky;
  top: 0;
  z-index: 1000;
  box-shadow: 0 4px 14px rgba(0,0,0,0.3);
}

.logo {
  font-size: 15px;
  font-weight: 900;
  text-align: center;
}

.logo span {
  color: #38bdf8;
  font-size: 22px;
}

.back-btn {
  color: white;
  text-decoration: none;
  background: rgba(255,255,255,0.12);
  padding: 9px 14px;
  border-radius: 12px;
  font-weight: 800;
}

.page {
  padding: 20px 16px;
}

.card {
  background: white;
  max-width: 520px;
  margin: 20px auto;
  padding: 22px;
  border-radius: 22px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
}

.card h1 {
  text-align: center;
  margin-bottom: 10px;
  font-size: 28px;
}

.card p {
  text-align: center;
  color: #6b7280;
  margin-bottom: 22px;
  line-height: 1.6;
}

.form-group {
  margin-bottom: 14px;
}

label {
  display: block;
  font-weight: 800;
  margin-bottom: 6px;
}

input,
select,
textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #d1d5db;
  border-radius: 12px;
  font-size: 15px;
  outline: none;
}

input:focus,
select:focus,
textarea:focus {
  border-color: #2563eb;
}

textarea {
  min-height: 120px;
  resize: vertical;
}

.submit-btn {
  width: 100%;
  border: none;
  background: #111827;
  color: white;
  padding: 14px;
  border-radius: 14px;
  font-weight: 900;
  font-size: 16px;
  cursor: pointer;
  margin-top: 8px;
}

.submit-btn:hover {
  background: #2563eb;
}
</style>
</head>

<body>

<header class="topbar">
  <a href="index.html" class="back-btn">← חזרה</a>

  <div class="logo">
    <span>go IL</span><br>
    אפילייט
  </div>

  <div style="width:70px"></div>
</header>


<main class="page">
  <div class="card">
    <h1>צור קשר</h1>
    <p>
      אנחנו כאן בשבילכם. מלאו את הפרטים ונחזור אליכם בהקדם האפשרי.
    </p>

   <form id="contactForm">

      <div class="form-group">
        <label for="customer_name">שם לקוח</label>
        <input
          type="text"
          id="customer_name"
          name="customer_name"
          placeholder="שם"
          required
        >
      </div>

      <div class="form-group">
        <label for="phone">טלפון לחזרה</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="הכניסו מספר טלפון"
          required
        >
      </div>

      <div class="form-group">
        <label for="email">אימייל</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="הכניסו כתובת אימייל"
          required
        >
      </div>

      <div class="form-group">
        <label for="reason">סיבת הפנייה</label>
        <select
          id="reason"
          name="reason"
          required
        >
          <option value="" selected disabled>
            בחרו סיבה
          </option>
          <option value="damaged">
            מוצר פגום או לא הגיע
          </option>
          <option value="question">
            שאלה
          </option>
          <option value="suggestions">
            הצעות לשיפור האתר
          </option>
        </select>
      </div>

      <div class="form-group">
        <label for="message">פירוט הפנייה</label>
        <textarea
          id="message"
          name="message"
          placeholder="כתבו כאן את פרטי הפנייה"
          required
        ></textarea>
      </div>

      <button type="submit" class="submit-btn">
        שליחת פנייה
      </button>

    </form>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://whpyiqqnsnxmldliuuqw.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_4DiLOWd_n4NUmzik7NGVeg_5CaFcqYT";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

document
  .getElementById("contactForm")
  .addEventListener("submit", async (e) => {

    e.preventDefault();

    const submitBtn = document.querySelector(".submit-btn");

    submitBtn.disabled = true;
    submitBtn.textContent = "שולח...";

    const customer_name =
      document.getElementById("customer_name").value.trim();

    const phone =
      document.getElementById("phone").value.trim();

    const email =
      document.getElementById("email").value.trim();

    const reason =
      document.getElementById("reason")
       .options[document.getElementById("reason").selectedIndex]
       .text;

    const message =
      document.getElementById("message").value.trim();

    const { error } = await supabaseClient
      .from("contact_requests")
      .insert([
        {
          customer_name,
          phone,
          email,
          reason,
          message
        }
      ]);

    if (error) {
      console.error(error);

      submitBtn.disabled = false;
      submitBtn.textContent = "שליחת פנייה";

      alert("אירעה שגיאה בשליחת הפנייה");
      return;
    }

    alert("הפנייה נשלחה בהצלחה!");

    document.getElementById("contactForm").reset();

    submitBtn.disabled = false;
    submitBtn.textContent = "שליחת פנייה";
  });
  
</script>

</body>
</html>
