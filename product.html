<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דף מוצר | go IL אפילייט</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #f3f4f6;
  color: #111;
}

/* סרגל עליון */
.topbar {
  height: 64px;
  background: linear-gradient(90deg, #111827, #1f2937, #0f172a);
  color: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  position: sticky;
  top: 0;
  z-index: 1000;
  box-shadow: 0 4px 14px rgba(0,0,0,0.3);
}

.logo {
  font-size: 15px;
  font-weight: 900;
  text-align: center;
  line-height: 1.2;
}

.logo span1 {
  color: #38bdf8;
  font-size: 22px;
}

.back-btn {
  background: rgba(255,255,255,0.12);
  border: none;
  color: white;
  padding: 8px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 700;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: 0.2s;
}


.product-img-wrap {
  position: relative;
}

.img-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 42px;
  height: 42px;
  border: none;
  border-radius: 50%;
  background: rgba(0,0,0,0.7);
  color: white;
  font-size: 26px;
  font-weight: bold;
  cursor: pointer;
  z-index: 10;
}

.img-arrow.right {
  right: 10px;
}

.img-arrow.left {
  left: 10px;
}
.back-btn:hover {
  background: rgba(255,255,255,0.22);
}

/* מיכל */
.page {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px 16px 40px;
}

/* הודעת טעינה / שגיאה */
.msg {
  text-align: center;
  padding: 80px 20px;
  font-size: 16px;
  color: #555;
}

/* כרטיס מוצר */
.product-box {
  border-radius: 18px;
  overflow: hidden;
  margin-top: 8px;
}

.product-img-wrap {
  width: 100%;
  background: #e3ecf7;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px;
  border-bottom: 1px solid #f0f0f0;
}

.product-img {
  width: 100%;
  height: 340px;
  object-fit: contain;
  border-radius: 10px;
}

.product-info {
  padding: 24px 20px 28px;
}

.product-name {
  font-size: 22px;
  font-weight: 900;
  margin-bottom: 14px;
  line-height: 1.35;
}

.price-row {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.price {
  font-size: 26px;
  font-weight: 900;
  color: #16a34a;
}

.old-price {
  font-size: 15px;
  text-decoration: line-through;
  color: #aaa;
}

.discount-badge {
  background: #fef2f2;
  color: #dc2626;
  font-size: 12px;
  font-weight: 800;
  padding: 3px 9px;
  border-radius: 20px;
  border: 1px solid #fecaca;
}

.description {
  font-size: 15px;
  color: #444;
  line-height: 1.7;
  margin-bottom: 24px;
  padding-bottom: 24px;
  border-bottom: 1px solid #f0f0f0;
}

/* כפתורים */
.actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.buy-link {
  display: block;
  width: 100%;
  text-align: center;
  background: linear-gradient(135deg, #111827, #1f2937);
  color: white;
  text-decoration: none;
  padding: 15px;
  border-radius: 12px;
  font-weight: 900;
  font-size: 16px;
  transition: 0.2s;
  box-shadow: 0 4px 14px rgba(0,0,0,0.18);
}

.buy-link:hover {
  opacity: 0.88;
  transform: translateY(-1px);
}

.buy-link:active {
  transform: scale(0.98);
}

.back {
  display: block;
  width: 100%;
  text-align: center;
  background: #f3f4f6;
  color: #333;
  text-decoration: none;
  padding: 13px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 15px;
  border: 1px solid #e5e7eb;
  transition: 0.2s;
}

.back:hover {
  background: #e5e7eb;
}

@media (min-width: 600px) {
  .product-box {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .product-img-wrap {
    border-bottom: none;
    border-left: 1px solid #f0f0f0;
    min-height: 380px;
  }

  .product-info {
    padding: 32px 28px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .actions {
    margin-top: auto;
    padding-top: 20px;
  }
}

.product-brand{
  font-size:13px;
  font-weight:700;
  color:#2563eb;
  margin-bottom:6px;
}

.product-subtitle{
  font-size:15px;
  color:#6b7280;
  margin-top:-6px;
  margin-bottom:16px;
  line-height:1.5;
}

.save-cart-btn{
  color:rgb(0, 0, 0);
  border:none;
  padding:8px 12px;
  border-radius:10px;
  font-size:13px;
  font-weight:800;
  cursor:pointer;
}
</style>
</head>
<body>

<header class="topbar">
  <a href="index.html" class="back-btn">
    ← חזרה
  </a>
  <div class="logo"><span1>go IL</span1><br><span>אפילייט</span></div>
  <div style="width:70px"></div>
  <button class="save-cart-btn" onclick="saveAndBack()">
  🛒 שמור לסל
</button>
</header>

<main class="page">
  <div id="productView" class="msg">טוען מוצר...</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://whpyiqqnsnxmldliuuqw.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_4DiLOWd_n4NUmzik7NGVeg_5CaFcqYT";

const sb = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

function formatPrice(price) {
  return "₪" + Number(price).toLocaleString("he-IL");
}

let currentProduct = null;

async function loadProduct() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const productView = document.getElementById("productView");

  if (!id) {
    productView.textContent = "לא נמצא מזהה מוצר";
    return;
  }

  const { data: product, error } = await sb
    .from("products")
    .select("*")
    .eq("id", id)
    .eq("is_active", true)
    .single();

if (error || !product) {
  console.error(error);
  productView.textContent = "המוצר לא נמצא";
  return;
}

currentProduct = product;

  const discount = product.old_price && product.sale_price
    ? Math.round((1 - product.sale_price / product.old_price) * 100)
    : null;

  productView.className = "product-box";

productImages = product.image_urls?.length
  ? product.image_urls
  : [product.image_url];

currentImageIndex = 0;

  productView.innerHTML = `
   <div class="product-img-wrap">
  ${productImages.length > 1 ? `
    <button class="img-arrow right" onclick="changeImage(-1)">‹</button>
  ` : ""}

  <img
    id="productMainImg"
    class="product-img"
    src="${productImages[0]}"
    alt="${product.name}"
  >

  ${productImages.length > 1 ? `
    <button class="img-arrow left" onclick="changeImage(1)">›</button>
  ` : ""}
</div>
    <div class="product-info">
<div class="product-brand">
  ${product.brand || ""}
</div>

<h1 class="product-name">
  ${product.name}
</h1>

${product.subtitle ? `
  <div class="product-subtitle">
    ${product.subtitle}
  </div>
` : ""}

      <div class="price-row">
        <span class="price">${formatPrice(product.sale_price)}</span>
        ${product.old_price ? `<span class="old-price">${formatPrice(product.old_price)}</span>` : ""}
        ${discount ? `<span class="discount-badge">-${discount}%</span>` : ""}
      </div>

      ${product.description ? `<div class="description">${product.description}</div>` : ""}

      <div class="actions">
        <a class="buy-link" href="${product.product_url || "#"}" target="_blank">
          🛒 מעבר לרכישה
        </a>
        <a class="back" href="index.html">← חזרה לכל המוצרים</a>
      </div>
    </div>
  `;
}


let productImages = [];
let currentImageIndex = 0;

function changeImage(direction) {
  currentImageIndex += direction;

  if (currentImageIndex < 0) {
    currentImageIndex = productImages.length - 1;
  }

  if (currentImageIndex >= productImages.length) {
    currentImageIndex = 0;
  }

  document.getElementById("productMainImg").src = productImages[currentImageIndex];
}


function saveAndBack(){

  if (!currentProduct) return;

  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  const existing = cart.find(
    item => String(item.id) === String(currentProduct.id)
  );

  if (existing){

    if (existing.quantity < (currentProduct.stock || 1)){
      existing.quantity++;
    }

  } else {

    cart.push({
      id: currentProduct.id,
      name: currentProduct.name,
      image: currentProduct.image_url,
      price: currentProduct.sale_price,
      stock: currentProduct.stock || 1,
      quantity: 1
    });

  }

  localStorage.setItem("cart", JSON.stringify(cart));

  window.location.href = "index.html";
}

loadProduct();
</script>

</body>
</html>
